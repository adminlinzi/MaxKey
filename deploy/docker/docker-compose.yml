# MaxKey 容器编排（生产/测试通用）
# 镜像均来自 GitHub 容器仓库 GHCR，版本通过环境变量注入：
#   GHCR        镜像前缀，默认 ghcr.io/adminlinzi
#   MXK_VERSION 镜像标签，默认取自 gradle.properties 的 4.2.0
# 用法：
#   导出镜像： docker compose build
#   启动全套： docker compose up -d
#   查看日志： docker compose logs -f maxkey
# 本地冒烟（CI 使用，镜像为本地构建）：
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d

x-maxkey-backend: &maxkey-backend
  environment:
    TZ: Asia/Shanghai
    DATABASE_HOST: maxkey-mysql
    DATABASE_PORT: "3306"
    DATABASE_NAME: maxkey
    DATABASE_USER: root
    DATABASE_PWD: maxkey
  networks:
    - maxkey
  restart: unless-stopped

services:
  mysql:
    image: mysql:8.4.2
    container_name: maxkey-mysql
    hostname: maxkey-mysql
    environment:
      MYSQL_ROOT_PASSWORD: maxkey
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
      - ./mysql/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - maxkey
    restart: unless-stopped

  maxkey:
    image: ${GHCR:-ghcr.io/adminlinzi}/maxkey:${MXK_VERSION:-4.2.0}
    container_name: maxkey
    hostname: maxkey
    <<: *maxkey-backend
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "9527:9527"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9527'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  maxkey-mgt:
    image: ${GHCR:-ghcr.io/adminlinzi}/maxkey-mgt:${MXK_VERSION:-4.2.0}
    container_name: maxkey-mgt
    hostname: maxkey-mgt
    <<: *maxkey-backend
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "9526:9526"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9526'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  maxkey-openapi:
    image: ${GHCR:-ghcr.io/adminlinzi}/maxkey-openapi:${MXK_VERSION:-4.2.0}
    container_name: maxkey-openapi
    hostname: maxkey-openapi
    <<: *maxkey-backend
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "9525:9525"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9525'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  maxkey-frontend:
    image: ${GHCR:-ghcr.io/adminlinzi}/maxkey-frontend:${MXK_VERSION:-4.2.0}
    container_name: maxkey-frontend
    hostname: maxkey-frontend
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8527:8527"
    networks:
      - maxkey
    restart: unless-stopped

  maxkey-mgt-frontend:
    image: ${GHCR:-ghcr.io/adminlinzi}/maxkey-mgt-frontend:${MXK_VERSION:-4.2.0}
    container_name: maxkey-mgt-frontend
    hostname: maxkey-mgt-frontend
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8526:8526"
    networks:
      - maxkey
    restart: unless-stopped

  maxkey-nginx:
    image: nginx:stable
    container_name: maxkey-nginx
    hostname: maxkey-nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - maxkey
      - maxkey-mgt
      - maxkey-frontend
      - maxkey-mgt-frontend
    networks:
      - maxkey
    restart: unless-stopped

networks:
  maxkey:
    driver: bridge

volumes:
  mysql-data:
