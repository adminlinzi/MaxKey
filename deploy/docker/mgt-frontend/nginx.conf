server {
    listen       8526;
    server_name  localhost;

    root   /usr/share/nginx/html/maxkey-mgt;
    index  index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html/maxkey-mgt;
    }
}
