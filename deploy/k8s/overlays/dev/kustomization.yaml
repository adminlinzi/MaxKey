apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: maxkey

resources:
  - ../../base

# overlay 负责把 Deployment 中的裸镜像名（maxkey / maxkey-mgt ...）改写为 GHCR 地址。
# 开发/测试环境默认使用 latest 标签（即“最新构建”别名，CI 会真实推送该标签，确保默认引用时标签真实存在）。
# latest 与具体版本号均为合法部署 tag；deploy-test 阶段二者都通过校验（只拦截 sha- 非法 tag），
# 但为确定性部署，deploy-test 会用 kustomize edit set image 把此处覆盖为本次提交 tag 的具体版本号。
images:
  - name: maxkey
    newName: ghcr.io/adminlinzi/maxkey
    newTag: latest
  - name: maxkey-mgt
    newName: ghcr.io/adminlinzi/maxkey-mgt
    newTag: latest
  - name: maxkey-openapi
    newName: ghcr.io/adminlinzi/maxkey-openapi
    newTag: latest
  - name: maxkey-frontend
    newName: ghcr.io/adminlinzi/maxkey-frontend
    newTag: latest
  - name: maxkey-mgt-frontend
    newName: ghcr.io/adminlinzi/maxkey-mgt-frontend
    newTag: latest
