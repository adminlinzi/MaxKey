apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: maxkey

resources:
  - ../../base

# 开发/测试环境默认使用 latest 标签；发布流水线会用
#   kustomize edit set image maxkey=ghcr.io/adminlinzi/maxkey:<版本>
# 覆盖此处标签后再 kubectl apply。
images:
  - name: maxkey
    newName: ghcr.io/adminlinzi/maxkey
    newTag: latest
  - name: maxkey-mgt
    newName: ghcr.io/adminlinzi/maxkey-mgt
    newTag: latest
  - name: maxkey-openapi
    newName: ghcr.io/adminlinzi/maxkey-openapi
    newTag: latest
  - name: maxkey-frontend
    newName: ghcr.io/adminlinzi/maxkey-frontend
    newTag: latest
  - name: maxkey-mgt-frontend
    newName: ghcr.io/adminlinzi/maxkey-mgt-frontend
    newTag: latest
