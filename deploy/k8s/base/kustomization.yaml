apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: maxkey

resources:
  - namespace.yaml
  - secrets.yaml
  - mysql/mysql-pvc.yaml
  - mysql/mysql-deployment.yaml
  - mysql/mysql-service.yaml
  - maxkey/deployment.yaml
  - maxkey/service.yaml
  - maxkey-mgt/deployment.yaml
  - maxkey-mgt/service.yaml
  - maxkey-openapi/deployment.yaml
  - maxkey-openapi/service.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  - mgt-frontend/deployment.yaml
  - mgt-frontend/service.yaml
  - nginx/configmap.yaml
  - nginx/deployment.yaml
  - nginx/service.yaml

# 镜像名在 Deployment 中以裸名（maxkey / maxkey-mgt ...）书写，
# 由 overlay 中的 kustomize images 转换器统一改写为 GHCR 地址与标签。
# base 不定义 images 转换器，避免 overlay/CI 用 kustomize edit set image 覆盖时，
# 因 base 与 overlay 同时存在同名 images 条目而导致覆盖不生效（实际清单仍保留 base 的 latest）。
