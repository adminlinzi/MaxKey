apiVersion: v1
kind: ConfigMap
metadata:
  name: maxkey-nginx-conf
  namespace: maxkey
data:
  default.conf: |
    server {
        listen       80;
        server_name  localhost;
        proxy_set_header host $host;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        location /sign/ {
            proxy_pass http://maxkey:9527/sign/;
        }

        location /maxkey/ {
            proxy_pass http://maxkey-frontend:8527/maxkey/;
        }

        location /maxkey-mgt-api/ {
            proxy_pass http://maxkey-mgt:9526/maxkey-mgt-api/;
        }

        location /maxkey-mgt/ {
            proxy_pass http://maxkey-mgt-frontend:8526/maxkey-mgt/;
        }

        location /maxkey-openapi/ {
            proxy_pass http://maxkey-openapi:9525/maxkey-openapi/;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
