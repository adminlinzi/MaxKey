apiVersion: apps/v1
kind: Deployment
metadata:
  name: maxkey-nginx
  namespace: maxkey
  labels:
    app: maxkey-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maxkey-nginx
  template:
    metadata:
      labels:
        app: maxkey-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: conf
          configMap:
            name: maxkey-nginx-conf
