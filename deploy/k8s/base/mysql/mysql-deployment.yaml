apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: maxkey
  labels:
    app: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4.2
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maxkey-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: TZ
              value: Asia/Shanghai
          command:
            - mysqld
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --explicit-defaults-for-timestamp=1
            # MySQL 8.4 已删除 default-authentication-plugin 变量，
            # 默认使用 caching_sha2_password；后端 JDBC URL 已带 allowPublicKeyRetrieval=true。
            - --authentication-policy=*,caching_sha2_password
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            # 注：hostPath 仅用于 kind 本地实部署验证。生产环境请改用托管数据库，
            # 或通过 db-init Job 加载 deploy/docker/mysql 下的初始化 SQL。
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: conf
              mountPath: /etc/mysql/conf.d
              readOnly: true
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'mysqladmin ping -uroot -p"$MYSQL_ROOT_PASSWORD" --silent'
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'mysqladmin ping -uroot -p"$MYSQL_ROOT_PASSWORD" --silent'
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'mysqladmin ping -uroot -p"$MYSQL_ROOT_PASSWORD" --silent'
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
        - name: initdb
          hostPath:
            path: /mnt/maxkey-mysql-init
            type: DirectoryOrCreate
        - name: conf
          hostPath:
            path: /mnt/maxkey-mysql-conf
            type: DirectoryOrCreate
