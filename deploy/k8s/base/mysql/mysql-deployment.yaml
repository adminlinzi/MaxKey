apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: maxkey
  labels:
    app: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4.2
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maxkey-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: TZ
              value: Asia/Shanghai
          # 不覆盖 command，保留 MySQL 官方镜像的 docker-entrypoint.sh entrypoint，
          # 使其能够：创建 mysql 用户、初始化 /var/lib/mysql、执行 /docker-entrypoint-initdb.d 下的 SQL。
          # 运行参数统一通过 /etc/mysql/conf.d/mysqld.cnf 注入。
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            # 注：hostPath 仅用于 kind 本地实部署验证。生产环境请改用托管数据库，
            # 或通过 db-init Job 加载 deploy/docker/mysql 下的初始化 SQL。
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: conf
              mountPath: /etc/mysql/conf.d
              readOnly: true
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'mysqladmin ping -uroot -p"$MYSQL_ROOT_PASSWORD" --silent'
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'mysqladmin ping -uroot -p"$MYSQL_ROOT_PASSWORD" --silent'
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'mysqladmin ping -uroot -p"$MYSQL_ROOT_PASSWORD" --silent'
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
        - name: initdb
          hostPath:
            path: /mnt/maxkey-mysql-init
            type: DirectoryOrCreate
        - name: conf
          hostPath:
            path: /mnt/maxkey-mysql-conf
            type: DirectoryOrCreate
