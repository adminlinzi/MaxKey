name: Docs

# 每次更新代码（PR / push 到 main）都检查说明文档一致性；
# 合并到 main 后自动用 git-cliff 重新生成 CHANGELOG.md 并回写仓库。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write # 仅 push 到 main 时回写 CHANGELOG 需要

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check docs consistency
        run: bash scripts/check-docs.sh

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Preview CHANGELOG (PR)
        if: github.event_name == 'pull_request'
        run: git-cliff --config cliff.toml --output CHANGELOG.preview.md

      - name: Upload CHANGELOG preview (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: changelog-preview
          path: CHANGELOG.preview.md

      - name: Update CHANGELOG on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git-cliff --config cliff.toml --output CHANGELOG.md
          if git diff --quiet CHANGELOG.md; then
            echo "CHANGELOG unchanged, skip commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "[skip ci] docs: update CHANGELOG"
          git push
