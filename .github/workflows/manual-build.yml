name: Manual Build

# 手动触发（workflow_dispatch）：应对少量代码修改但未发布版本的情况。
#   - 构建产物（后端 bootJar + 前端静态包）
#   - 多架构（amd64 / arm64）构建并推送镜像到 GHCR
#   - 镜像标签必须是明确的版本号（由运行人指定，例如 4.1.12-dev1）；禁止 latest 与 sha-* 标签
#   - 不创建 GitHub Release（区别于 release.yml）
#   - 可选：本地 docker-compose 冒烟测试
#
# 在仓库 Actions 页选择 "Manual Build" -> "Run workflow"，需指定：
#   image_tag   明确的镜像标签（必填，例如 4.1.12-dev1；禁止 latest / sha-）
#   push_images 是否推送镜像到 GHCR（默认 true）
#   smoke_test  是否运行 docker-compose 本地冒烟（默认 true）
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR 镜像标签（必填，必须是明确版本号，例如 4.1.12-dev1；禁止使用 latest 或 sha- 开头）"
        required: true
        default: ""
      push_images:
        description: "是否推送镜像到 GHCR"
        required: false
        default: true
        type: boolean
      smoke_test:
        description: "是否运行 docker-compose 本地冒烟测试"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute image tag
        id: tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            echo "::error::image_tag 必填，且必须是明确的版本号（禁止使用 latest 或 sha- 开头）"
            exit 1
          fi
          if [ "$TAG" = "latest" ] || [[ "$TAG" == sha-* ]]; then
            echo "::error::禁止使用 latest 或 sha- 开头的标签：收到 '$TAG'"
            exit 1
          fi
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image tag = $TAG"

      - name: Build artifacts (backend + frontend)
        uses: ./.github/actions/build

      - name: Upload backend jars
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: maxkey-webs/**/build/libs/*-boot-*-ga.jar
          if-no-files-found: error

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: maxkey-web-frontend/*/dist
          if-no-files-found: error

  images:
    needs: build
    if: ${{ github.event.inputs.push_images == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: maxkey
            context: maxkey-webs/maxkey-web-maxkey
            dockerfile: maxkey-webs/maxkey-web-maxkey/Dockerfile
          - name: maxkey-mgt
            context: maxkey-webs/maxkey-web-mgt
            dockerfile: maxkey-webs/maxkey-web-mgt/Dockerfile
          - name: maxkey-openapi
            context: maxkey-webs/maxkey-web-openapi
            dockerfile: maxkey-webs/maxkey-web-openapi/Dockerfile
          - name: maxkey-frontend
            context: deploy/docker/frontend
            dockerfile: deploy/docker/frontend/Dockerfile
          - name: maxkey-mgt-frontend
            context: deploy/docker/mgt-frontend
            dockerfile: deploy/docker/mgt-frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Download backend jars
        if: contains(matrix.name, 'maxkey') && matrix.name != 'maxkey-frontend' && matrix.name != 'maxkey-mgt-frontend'
        uses: actions/download-artifact@v4
        with:
          name: backend-jars
          path: .

      - name: Download frontend dist
        if: matrix.name == 'maxkey-frontend' || matrix.name == 'maxkey-mgt-frontend'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: .

      - name: Stage backend jar
        if: contains(matrix.name, 'maxkey') && matrix.name != 'maxkey-frontend' && matrix.name != 'maxkey-mgt-frontend'
        shell: bash
        run: |
          rm -rf "${{ matrix.context }}/build/libs"
          mkdir -p "${{ matrix.context }}/build/libs"
          jar_file=$(find . -type f -name '${{ matrix.name }}-boot-*-ga.jar' | head -n 1)
          if [ -z "$jar_file" ]; then
            echo "::error::Could not find ${{ matrix.name }}-boot-*-ga.jar artifact"
            exit 1
          fi
          cp "$jar_file" "${{ matrix.context }}/build/libs/"
          ls -la "${{ matrix.context }}/build/libs/"

      - name: Stage frontend dist
        if: matrix.name == 'maxkey-frontend' || matrix.name == 'maxkey-mgt-frontend'
        shell: bash
        run: |
          rm -rf deploy/docker/frontend/dist deploy/docker/mgt-frontend/dist
          app_dist=$(find . -type d -path '*/maxkey-web-app/dist' | head -n 1)
          mgt_dist=$(find . -type d -path '*/maxkey-web-mgt-app/dist' | head -n 1)
          if [ -z "$app_dist" ] || [ -z "$mgt_dist" ]; then
            echo "::error::Could not find frontend dist directories"
            exit 1
          fi
          cp -r "$app_dist" deploy/docker/frontend/dist
          cp -r "$mgt_dist" deploy/docker/mgt-frontend/dist
          ls -la deploy/docker/frontend/dist deploy/docker/mgt-frontend/dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          # 仅推送运行人指定的明确版本标签；禁止 latest 与 sha-* 标签。
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ needs.build.outputs.image_tag }}

  smoke-test:
    needs: build
    if: ${{ github.event.inputs.smoke_test == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend jars
        uses: actions/download-artifact@v4
        with:
          name: backend-jars
          path: .

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: .

      - name: Stage backend jars
        shell: bash
        run: |
          find_jar() { find . -type f -name "$1" | head -n 1; }
          stage_jar() {
            local name="$1" ctx="$2"
            rm -rf "$ctx/build/libs"
            mkdir -p "$ctx/build/libs"
            local jar_file
            jar_file=$(find_jar "$name-boot-*-ga.jar")
            if [ -z "$jar_file" ]; then
              echo "::error::Could not find $name-boot-*-ga.jar artifact"
              exit 1
            fi
            cp "$jar_file" "$ctx/build/libs/"
            ls -la "$ctx/build/libs/"
          }
          stage_jar maxkey       maxkey-webs/maxkey-web-maxkey
          stage_jar maxkey-mgt   maxkey-webs/maxkey-web-mgt
          stage_jar maxkey-openapi maxkey-webs/maxkey-web-openapi

      - name: Stage frontend dist
        shell: bash
        run: |
          rm -rf deploy/docker/frontend/dist deploy/docker/mgt-frontend/dist
          app_dist=$(find . -type d -path '*/maxkey-web-app/dist' | head -n 1)
          mgt_dist=$(find . -type d -path '*/maxkey-web-mgt-app/dist' | head -n 1)
          if [ -z "$app_dist" ] || [ -z "$mgt_dist" ]; then
            echo "::error::Could not find frontend dist directories"
            exit 1
          fi
          cp -r "$app_dist" deploy/docker/frontend/dist
          cp -r "$mgt_dist" deploy/docker/mgt-frontend/dist
          ls -la deploy/docker/frontend/dist deploy/docker/mgt-frontend/dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend images (local, amd64)
        shell: bash
        run: |
          docker build -t maxkey:ci          -f maxkey-webs/maxkey-web-maxkey/Dockerfile   maxkey-webs/maxkey-web-maxkey
          docker build -t maxkey-mgt:ci      -f maxkey-webs/maxkey-web-mgt/Dockerfile       maxkey-webs/maxkey-web-mgt
          docker build -t maxkey-openapi:ci  -f maxkey-webs/maxkey-web-openapi/Dockerfile   maxkey-webs/maxkey-web-openapi

      - name: Build frontend images (local, amd64)
        shell: bash
        run: |
          docker build -t maxkey-frontend:ci       -f deploy/docker/frontend/Dockerfile      deploy/docker/frontend
          docker build -t maxkey-mgt-frontend:ci   -f deploy/docker/mgt-frontend/Dockerfile  deploy/docker/mgt-frontend

      - name: Compose smoke test
        shell: bash
        run: |
          set -e
          docker compose -f deploy/docker/docker-compose.yml -f deploy/docker/docker-compose.local.yml up -d
          wait_for() {
            local url="$1" name="$2"
            for i in $(seq 1 90); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
              if [ "$code" != "000" ]; then
                echo "$name OK (http $code)"; return 0
              fi
              echo "$name not ready (conn refused), retry $i/90"
              sleep 10
            done
            echo "::error::$name failed to become ready"
            docker compose -f deploy/docker/docker-compose.yml -f deploy/docker/docker-compose.local.yml logs --no-color
            return 1
          }
          wait_for http://localhost:9527/sign/            maxkey
          wait_for http://localhost:9526/maxkey-mgt-api/  maxkey-mgt
          wait_for http://localhost:8527/                 maxkey-frontend
          wait_for http://localhost:8526/                 maxkey-mgt-frontend
          wait_for http://localhost/                       maxkey-nginx
          echo "Compose smoke test passed"

      - name: Tear down compose
        if: always()
        shell: bash
        run: |
          docker compose -f deploy/docker/docker-compose.yml -f deploy/docker/docker-compose.local.yml down -v || true

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Install kustomize
        shell: bash
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" | tar xz
          chmod +x kustomize
          sudo mv kustomize /usr/local/bin/
          kustomize version

      - name: kubectl apply --dry-run
        shell: bash
        # CI 无 K8s 集群。kubectl apply -k 仍会触发 API discovery，因此改为：
        # kustomize build 生成纯 YAML 后，再由 kubectl 做客户端 dry-run（--validate=false）。
        run: kustomize build deploy/k8s/overlays/dev | kubectl apply --dry-run=client --validate=false -f -
