name: Release

# 推送语义化版本 tag（如 4.2.0，不带 v 前缀）触发完整发布流水线：
#   1) 构建产物
#   2) 多架构构建并推送镜像到 GHCR
#   3) kind 临时集群实部署验证镜像可用
#   4) 创建 GitHub Release 并上传制品（后端 jar / 前端静态包 / deploy 包）
on:
  push:
    tags:
      - "*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_release: ${{ steps.v.outputs.is_release }}
    steps:
      - id: v
        run: |
          TAG="${GITHUB_REF_NAME}"
          V="${TAG#v}"
          if [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "version=$V" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build artifacts
        uses: ./.github/actions/build
      - name: Upload backend jars
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: maxkey-webs/**/build/libs/*-boot-*-ga.jar
          if-no-files-found: error
      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: maxkey-web-frontend/*/dist
          if-no-files-found: error

  images:
    needs: [prepare, build]
    if: needs.prepare.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: maxkey
            context: maxkey-webs/maxkey-web-maxkey
            dockerfile: maxkey-webs/maxkey-web-maxkey/Dockerfile
          - name: maxkey-mgt
            context: maxkey-webs/maxkey-web-mgt
            dockerfile: maxkey-webs/maxkey-web-mgt/Dockerfile
          - name: maxkey-openapi
            context: maxkey-webs/maxkey-web-openapi
            dockerfile: maxkey-webs/maxkey-web-openapi/Dockerfile
          - name: maxkey-frontend
            context: deploy/docker/frontend
            dockerfile: deploy/docker/frontend/Dockerfile
          - name: maxkey-mgt-frontend
            context: deploy/docker/mgt-frontend
            dockerfile: deploy/docker/mgt-frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Download backend jars
        if: contains(matrix.name, 'maxkey') && matrix.name != 'maxkey-frontend' && matrix.name != 'maxkey-mgt-frontend'
        uses: actions/download-artifact@v4
        with:
          name: backend-jars
          path: .
      - name: Download frontend dist
        if: matrix.name == 'maxkey-frontend' || matrix.name == 'maxkey-mgt-frontend'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: .
      - name: Stage backend jar
        if: contains(matrix.name, 'maxkey') && matrix.name != 'maxkey-frontend' && matrix.name != 'maxkey-mgt-frontend'
        shell: bash
        run: |
          rm -rf "${{ matrix.context }}/build/libs"
          mkdir -p "${{ matrix.context }}/build/libs"
          jar_file=$(find . -type f -name '${{ matrix.name }}-boot-*-ga.jar' | head -n 1)
          if [ -z "$jar_file" ]; then
            echo "::error::Could not find ${{ matrix.name }}-boot-*-ga.jar artifact"
            exit 1
          fi
          cp "$jar_file" "${{ matrix.context }}/build/libs/"
          ls -la "${{ matrix.context }}/build/libs/"
      - name: Stage frontend dist
        if: matrix.name == 'maxkey-frontend' || matrix.name == 'maxkey-mgt-frontend'
        shell: bash
        run: |
          rm -rf deploy/docker/frontend/dist deploy/docker/mgt-frontend/dist
          app_dist=$(find . -type d -path '*/maxkey-web-app/dist' | head -n 1)
          mgt_dist=$(find . -type d -path '*/maxkey-web-mgt-app/dist' | head -n 1)
          if [ -z "$app_dist" ] || [ -z "$mgt_dist" ]; then
            echo "::error::Could not find frontend dist directories"
            exit 1
          fi
          cp -r "$app_dist" deploy/docker/frontend/dist
          cp -r "$mgt_dist" deploy/docker/mgt-frontend/dist
          ls -la deploy/docker/frontend/dist deploy/docker/mgt-frontend/dist
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          # 关闭 SLSA provenance / SBOM 证明清单，避免 GHCR 把证明 manifest 渲染成 unknown/unknown。
          provenance: false
          sbom: false
          # 仅推送明确版本号标签；禁止 latest 与 sha-* 标签。
          # edge 为“最新构建”别名（非 latest/sha-），供 dev overlay 默认引用与本地 kubectl apply 使用。
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ needs.prepare.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:edge

  deploy-test:
    needs: [prepare, images]
    if: needs.prepare.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          config: deploy/k8s/kind/kind.yaml
          wait: 180s
      # kind 默认集群名 chart-testing；预先拉取 Docker Hub 公共镜像并加载到 kind 节点，
      # 避免 GitHub Actions 网络到 Docker Hub 超时/限流导致 mysql/nginx 拉取失败。
      - name: Preload public images into kind
        shell: bash
        run: |
          kind_cluster=$(kind get clusters | head -n 1)
          echo "Kind cluster: ${kind_cluster}"
          docker pull mysql:8.4.2
          kind load docker-image mysql:8.4.2 --name "${kind_cluster}"
          docker pull nginx:stable
          kind load docker-image nginx:stable --name "${kind_cluster}"
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
      - name: Install kustomize
        shell: bash
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" | tar xz
          chmod +x kustomize
          sudo mv kustomize /usr/local/bin/
          kustomize version
      # kind 默认只能拉取公共镜像；若 GHCR 包为私有（GitHub 默认），
      # 需创建 imagePullSecret 并绑定到 default serviceaccount，否则 maxkey 等镜像拉取失败。
      - name: Create namespace and GHCR image pull secret for kind
        shell: bash
        run: |
          kubectl create namespace maxkey --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n maxkey create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n maxkey patch serviceaccount default -p '{"imagePullSecrets":[{"name":"ghcr-pull"}]}'

      - name: Pin image tags in dev overlay
        shell: bash
        run: |
          cd deploy/k8s/overlays/dev
          VERSION="${{ needs.prepare.outputs.version }}"
          OWNER="${{ github.repository_owner }}"
          for s in maxkey maxkey-mgt maxkey-openapi maxkey-frontend maxkey-mgt-frontend; do
            kustomize edit set image "$s=ghcr.io/${OWNER}/$s:${VERSION}"
          done
          kustomize build . > /tmp/manifests.yaml
          echo "=== 部署清单中的镜像标签 ==="
          grep -E 'image: ghcr.io' /tmp/manifests.yaml
          # 硬性校验：部署清单不得出现 edge / latest / sha-，且必须包含本次提交 tag 的版本号
          if grep -Eq 'image:.*:(edge|latest|sha-[0-9a-f]+)$' /tmp/manifests.yaml; then
            echo "::error::部署清单仍含禁止标签（edge/latest/sha-），终止部署以避免拉取错误镜像"
            grep -E 'image:' /tmp/manifests.yaml
            exit 1
          fi
          if ! grep -q "image: ghcr.io/${OWNER}/maxkey:${VERSION}" /tmp/manifests.yaml; then
            echo "::error::未找到预期版本标签 ${VERSION}，终止部署"
            grep -E 'image:' /tmp/manifests.yaml
            exit 1
          fi
          kubectl apply -f /tmp/manifests.yaml
      - name: Wait for rollout
        run: |
          for d in mysql maxkey maxkey-mgt maxkey-openapi maxkey-frontend maxkey-mgt-frontend maxkey-nginx; do
            kubectl -n maxkey rollout status "deploy/$d" --timeout=600s
          done
      - name: Debug on rollout failure
        if: failure()
        shell: bash
        run: |
          echo "=== Pods ==="
          kubectl get pods -n maxkey -o wide
          echo "=== Events ==="
          kubectl get events -n maxkey --sort-by=.lastTimestamp
          for d in mysql maxkey maxkey-mgt maxkey-openapi maxkey-frontend maxkey-mgt-frontend maxkey-nginx; do
            echo "=== Deployment $d ==="
            kubectl -n maxkey describe deploy "$d" || true
            echo "=== Logs for $d ==="
            kubectl -n maxkey logs -l "app=$d" --tail=300 || true
            kubectl -n maxkey logs -l "app=$d" --tail=300 --previous || true
          done
          echo "=== MySQL config dump ==="
          kubectl -n maxkey exec deploy/mysql -i -- cat /etc/mysql/conf.d/mysqld.cnf 2>/dev/null || true
          echo "=== MySQL init dir ==="
          kubectl -n maxkey exec deploy/mysql -i -- ls -la /docker-entrypoint-initdb.d/ 2>/dev/null || true
      - name: Smoke test via nginx (NodePort 30080 -> host 80)
        run: |
          set -e
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/sign/ || true)
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then break; fi
            echo "sign not ready ($code), retry $i/40"; sleep 10
          done
          curl -f http://localhost/sign/
          curl -f http://localhost/maxkey/
          curl -f http://localhost/maxkey-mgt/
          echo "✅ Kind deploy-test passed"

  release:
    needs: [prepare, build, images, deploy-test]
    if: needs.prepare.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download backend jars
        uses: actions/download-artifact@v4
        with:
          name: backend-jars
          path: artifacts/backend
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: artifacts/frontend
      - name: Package artifacts
        shell: bash
        run: |
          set -e
          cd "${{ github.workspace }}"
          mkdir -p out

          # 后端 bootJar：下载路径可能保留原目录结构或被 flatten，统一在 artifacts/backend 下查找
          backend_dir="artifacts/backend"
          jars=$(find "$backend_dir" -type f -name '*-boot-*-ga.jar' | sort)
          if [ -z "$jars" ]; then
            echo "::error::No backend boot jars found in $backend_dir"
            find "$backend_dir" -type f -o -type d | head -50
            exit 1
          fi
          echo "Backend jars found:"
          echo "$jars"

          # 各后端组件单独打包成独立 Release asset
          pack_jar() {
            local prefix="$1"
            local asset="$2"
            local jar_file=$(find "$backend_dir" -type f -name "${prefix}-*-ga.jar" | head -n 1)
            if [ -z "$jar_file" ]; then
              echo "::error::Could not find ${prefix}-*-ga.jar"
              find "$backend_dir" -type f | head -20
              exit 1
            fi
            echo "Packaging $jar_file -> out/$asset"
            zip -j "out/$asset" "$jar_file"
          }
          pack_jar "maxkey-boot"        "maxkey-web-maxkey.zip"
          pack_jar "maxkey-mgt-boot"    "maxkey-web-mgt.zip"
          pack_jar "maxkey-openapi-boot" "maxkey-web-openapi.zip"

          # 前端静态包：同样通过查找定位，避免依赖固定相对路径
          app_dist=$(find artifacts/frontend -type d -path '*/maxkey-web-app/dist' | head -n 1)
          mgt_dist=$(find artifacts/frontend -type d -path '*/maxkey-web-mgt-app/dist' | head -n 1)
          if [ -z "$app_dist" ] || [ -z "$mgt_dist" ]; then
            echo "::error::Frontend dist directories not found in artifacts/frontend"
            find artifacts/frontend -type d | head -50
            exit 1
          fi
          echo "Frontend dist: $app_dist"
          echo "Mgt frontend dist: $mgt_dist"
          (cd "$app_dist" && zip -r "${{ github.workspace }}/out/maxkey-frontend.zip" .)
          (cd "$mgt_dist" && zip -r "${{ github.workspace }}/out/maxkey-mgt-frontend.zip" .)

          # 部署文件打包
          (cd deploy && zip -r "${{ github.workspace }}/out/maxkey-deploy.zip" .)

          echo "=== Release assets ==="
          ls -lh out
      - name: Generate release notes
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Build release notes
        run: git-cliff --config cliff.toml --tag ${{ needs.prepare.outputs.version }} --output release-notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: MaxKey ${{ needs.prepare.outputs.version }}
          body_path: release-notes.md
          files: |
            out/maxkey-web-maxkey.zip
            out/maxkey-web-mgt.zip
            out/maxkey-web-openapi.zip
            out/maxkey-frontend.zip
            out/maxkey-mgt-frontend.zip
            out/maxkey-deploy.zip
          fail_on_unmatched_files: false
