name: Build MaxKey artifacts
description: >
  构建 MaxKey 的可运行产物：后端 bootJar（Gradle / JDK 21）与前端静态包
  （Angular 13 / Node 16）。产物直接落在工作区内，供同一次流水线的后续步骤使用。
runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"
        cache: gradle

    - name: Set up Node 16
      uses: actions/setup-node@v4
      with:
        node-version: "16"

    - name: Grant execute permission for gradlew
      shell: bash
      run: chmod +x gradlew

    - name: Build backend (Gradle, skip tests)
      shell: bash
      run: ./gradlew clean build -x test --no-daemon

    - name: Build frontend - maxkey-web-app
      shell: bash
      working-directory: maxkey-web-frontend/maxkey-web-app
      run: |
        npm install --ignore-scripts --registry https://registry.npmmirror.com
        node --max_old_space_size=8000 ./node_modules/@angular/cli/bin/ng build --base-href /maxkey/

    - name: Build frontend - maxkey-web-mgt-app
      shell: bash
      working-directory: maxkey-web-frontend/maxkey-web-mgt-app
      run: |
        npm install --ignore-scripts --registry https://registry.npmmirror.com
        node --max_old_space_size=8000 ./node_modules/@angular/cli/bin/ng build --base-href /maxkey-mgt/

    - name: Stage frontend dist for docker build
      shell: bash
      run: |
        rm -rf deploy/docker/frontend/dist deploy/docker/mgt-frontend/dist
        cp -r maxkey-web-frontend/maxkey-web-app/dist deploy/docker/frontend/dist
        cp -r maxkey-web-frontend/maxkey-web-mgt-app/dist deploy/docker/mgt-frontend/dist
